<!DOCTYPE html>
<html>
<head>
    <title>Photo GPS Reader</title>

    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #results {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Photo GPS Reader</h1>

<input type="file" id="photo">

<div id="results"></div>

<script>

document.getElementById('photo').addEventListener('change', async (e) => {

    const file = e.target.files[0];

    if (!file) return;

    try {

        const gps = await exifr.gps(file);

        if (gps &&
            gps.latitude &&
            gps.longitude &&
            !isNaN(gps.latitude) &&
            !isNaN(gps.longitude)) {

            document.getElementById('results').innerHTML =
            `
            <h3>GPS Found</h3>
            <p>Latitude: ${gps.latitude}</p>
            <p>Longitude: ${gps.longitude}</p>
            `;

            console.log("Latitude:", gps.latitude);
            console.log("Longitude:", gps.longitude);

        }
        else {

            document.getElementById('results').innerHTML =
            `
            <h3>No GPS Coordinates Found</h3>
            <p>This image does not contain standard EXIF GPS coordinates.</p>
            `;

        }

    }
    catch(err) {

        console.error(err);

        document.getElementById('results').innerHTML =
        `
        <h3>Error Reading Metadata</h3>
        <p>${err.message || err}</p>
        `;

    }

});

</script>

</body>
</html>
